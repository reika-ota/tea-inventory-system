name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 静的解析
        run: npm run lint
      - name: 整形チェック
        run: npm run format:check
      - name: 型チェック
        run: npm run typecheck
      - name: 単体テスト
        run: npm test
      - name: ビルド（gas・frontend）
        run: npm run build
