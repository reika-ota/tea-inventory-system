<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaicoss ワイヤーフレーム（SC-01〜SC-07）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ec; --surface:#ffffff; --ink:#1d2621; --muted:#5d6b62; --line:#d9dfd8;
  --primary:#3f6b3a; --primary-soft:#e3ebdf;
  --expired:#b3261e; --expired-soft:#f8e1de;
  --near:#9a5f07; --near-soft:#f7ead2;
  --low:#2f5b7a; --low-soft:#dfe9f1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:"Zen Kaku Gothic New",system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.material-icons{font-size:24px;line-height:1;vertical-align:middle}
.material-icons.sm{font-size:18px}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:88px}

/* app bar */
.appbar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:4px;height:56px;padding:0 8px 0 16px}
.appbar h1{font-size:20px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar.detail{padding-left:4px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.icon-btn:active{background:var(--bg)}

/* attention filters */
.attn{display:flex;gap:8px;padding:12px 16px 4px}
.attn button{flex:1;border-radius:10px;padding:8px 6px;text-align:left;border:1.5px solid transparent}
.attn .n{display:block;font-size:22px;font-weight:700;line-height:1.1}
.attn .l{font-size:12px}
.attn .expired{background:var(--expired-soft);color:var(--expired)}
.attn .near{background:var(--near-soft);color:var(--near)}
.attn .low{background:var(--low-soft);color:var(--low)}
.attn button[aria-pressed="true"]{border-color:currentColor}

.search{margin:8px 16px 0;display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:0 12px;height:44px}
.search input{border:none;outline:none;flex:1;background:none;min-width:0}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;
  border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--liq)}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px 6px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{padding:5px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary);font-weight:700}
.toolbar select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);font-size:13px}
.count{font-size:12px;color:var(--muted);padding:0 16px 6px}

/* list */
.list{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);
  text-decoration:none;color:inherit}
.row:last-child{border-bottom:none}
.row:active{background:var(--bg)}
button.row{width:100%;text-align:left;background:var(--surface)}
button.body{text-align:left}
.cup{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--liq);
  background:linear-gradient(to top,var(--liq) var(--fill),#fff var(--fill))}
.cup.lg{width:64px;height:64px;border-width:3px}
.row .body{flex:1;min-width:0}
.row .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px}
.badge.expired{background:var(--expired-soft);color:var(--expired)}
.badge.near{background:var(--near-soft);color:var(--near)}
.badge.low{background:var(--low-soft);color:var(--low)}
.badge.plain{background:var(--primary-soft);color:var(--primary)}
.row .qty{flex:none;text-align:right}
.serv{font-size:13px;color:var(--muted)}
.serv b{font-size:22px;color:var(--ink);font-weight:700;margin:0 2px}
.sub{font-size:12px;color:var(--muted)}

.section-title{font-size:14px;font-weight:700;color:var(--muted);padding:20px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.row .btn-sm{flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;font-weight:700;
  height:44px;padding:0 16px}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:active{filter:brightness(.9)}
.btn.outline{border:1.5px solid var(--primary);color:var(--primary);background:var(--surface)}
.btn.text{color:var(--primary);padding:0 8px}
.btn.danger{background:var(--expired);color:#fff}
.btn.block{width:100%}
.btn-sm{height:34px;font-size:13px;padding:0 12px;border-radius:8px}
.btn[disabled]{opacity:.4;pointer-events:none}

.fab{position:fixed;right:max(16px,calc(50vw - 224px));bottom:84px;width:56px;height:56px;border-radius:16px;
  background:var(--primary);color:#fff;display:grid;place-items:center;box-shadow:0 3px 8px rgba(31,48,35,.3);z-index:20}

/* bottom nav */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:64px;
  background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  text-decoration:none;color:var(--muted);font-size:12px}
.bnav button .i{font-size:24px}
.bnav button[aria-current="page"]{color:var(--primary);font-weight:700}

/* detail */
.hero{background:var(--surface);padding:16px;display:flex;gap:16px;align-items:center;border-bottom:1px solid var(--line)}
.hero .genre{font-size:13px;color:var(--muted)}
.hero .flv{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.hero .total{margin-top:6px;font-size:13px;color:var(--muted)}
.hero .total b{font-size:18px;color:var(--ink)}

.panel{background:var(--surface);margin:12px;border-radius:14px;padding:16px;border:1px solid var(--line)}
.target{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.target .pin{color:var(--primary);font-weight:700}
.stepper{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:14px}
.stepper button{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.stepper button[disabled]{opacity:.35}
.stepper .val{min-width:84px;text-align:center}
.stepper .val b{font-size:34px;font-weight:700}
.stepper .val span{font-size:15px;margin-left:2px}
.stepper .max{display:block;font-size:11px;color:var(--muted)}
.panel .main{height:56px;font-size:17px;border-radius:12px}
.panel .alt{display:flex;justify-content:center;gap:4px;margin-top:8px}
.panel .short{font-size:13px;color:var(--near);text-align:center;margin-bottom:10px}

.lot{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.lot:last-child{border-bottom:none}
.lot .b{flex:1;min-width:0}
.lot .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lot .rem{font-size:18px;font-weight:700}
.lot .of{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--bg);margin:6px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--liq)}
.lot .dates{font-size:12px;color:var(--muted)}
.lot.depleted{opacity:.6}

.info{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 16px}
.info div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.info div:last-child{border-bottom:none}
.info dt{color:var(--muted)}
.info dd{text-align:right;max-width:65%}

.hist{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hist .h{display:flex;justify-content:space-between;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px}
.hist .h:last-child{border-bottom:none}
.hist .when{color:var(--muted);font-size:12px}
.hist .d{font-weight:700;text-align:right;white-space:nowrap}
.hist .d.minus{color:var(--ink)} .hist .d.plus{color:var(--primary)}
.hist .after{font-size:12px;color:var(--muted);font-weight:400}

.placeholder{padding:80px 24px;text-align:center;color:var(--muted)}
.note{margin:16px;font-size:12px;color:var(--muted);line-height:1.6}

/* sheet / dialog / snackbar */
.scrim{position:fixed;inset:0;background:rgba(20,28,23,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim.center{align-items:center;padding:24px}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:8px 0 calc(12px + env(safe-area-inset-bottom))}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.sheet h3{font-size:14px;color:var(--muted);padding:4px 20px 8px;font-weight:500}
.sheet button{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:14px 20px;font-size:15px}
.sheet button .material-icons{color:var(--muted)}
.sheet .danger .material-icons{color:var(--expired)}
.sheet button:active{background:var(--bg)}
.sheet button[disabled]{color:var(--muted)}
.sheet .why{display:block;font-size:12px;color:var(--muted)}
.sheet .danger{color:var(--expired)}
.dialog{background:var(--surface);width:100%;max-width:360px;border-radius:16px;padding:20px}
.dialog h3{font-size:18px;margin-bottom:8px}
.dialog p{font-size:14px;color:var(--muted);margin-bottom:12px}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.field{display:block;margin-top:10px}
.field .flabel{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:16px}
.field .err{color:var(--expired);font-size:12px;margin-top:4px;min-height:1em}
.snack{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;width:calc(100% - 32px);max-width:448px;
  background:#27332b;color:#fff;border-radius:10px;padding:12px 8px 12px 16px;display:flex;align-items:center;gap:8px;z-index:50;font-size:14px}
.snack.detail{bottom:16px}
.snack span{flex:1}
.snack button{color:#b9dcae;font-weight:700;padding:6px 10px}

/* forms (SC-04 / SC-05) */
.form{background:var(--surface);padding:4px 16px 20px;border-bottom:1px solid var(--line)}
.form .field{margin-top:18px}
.field .flabel{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field .req{color:var(--expired);margin-left:2px}
.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;resize:vertical;font-family:inherit}
.field input[type=date]{-webkit-appearance:none;appearance:none;background:var(--surface);display:flex;align-items:center}
.form .err{min-height:0}
.help{font-size:12px;color:var(--muted);margin-top:4px}
.dup{font-size:12px;color:var(--near);margin-top:4px}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags:not(:empty){margin-bottom:8px}
.tagx{display:inline-flex;align-items:center;gap:2px;height:30px;padding:0 4px 0 12px;border-radius:15px;background:var(--primary-soft);color:var(--primary);font-size:13px}
.tagx button{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;color:var(--primary)}
.addrow{display:flex;gap:8px;align-items:center}
.addrow input{flex:1}
.addrow .btn{height:44px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.sugg .hint{font-size:12px;color:var(--muted);margin-right:2px}
.sugg .chip{height:28px;font-size:12px}
.unit{display:flex;align-items:center;gap:8px}
.unit input{flex:1}
.unit .u{font-size:15px;min-width:1.5em}
.fixed{min-height:44px;display:flex;align-items:center;padding:0 12px;border-radius:8px;background:var(--bg);color:var(--muted);font-size:14px}
.seg.big{display:flex}
.seg.big button{flex:1;padding:10px 12px;font-size:14px}
.seg button[disabled]{opacity:.45}
.infobox{margin-top:14px;font-size:13px;background:var(--primary-soft);color:var(--primary);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start}
.date-row{display:flex;gap:8px;align-items:center}
.date-row input{flex:1}
.footer{position:sticky;bottom:0;background:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}

/* SC-06 集計 */
.stats{display:flex;gap:8px;padding:12px 16px 4px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .n{font-size:22px;font-weight:700;line-height:1.2}
.stat .n small{font-size:13px;font-weight:500;margin-left:1px}
.stat .l{font-size:12px;color:var(--muted)}
.grow{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:var(--surface)}
.grow:last-child{border-bottom:none}
.grow:active{background:var(--bg)}
.grow .gm{flex:1;min-width:0}
.grow .gname{font-weight:700}
.grow .gsub{font-size:12px;color:var(--muted)}
.gbar{height:6px;border-radius:3px;background:var(--bg);margin-top:6px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--liq)}
.grow .gv{text-align:right;font-size:12px;color:var(--muted);flex:none;line-height:1.6}
.grow .gv b{color:var(--ink);font-size:15px}
.grow.zero{opacity:.5}
.dotlg{flex:none;width:14px;height:14px;border-radius:50%;background:var(--liq)}
/* SC-07 設定 */
.srow{display:flex;gap:12px;align-items:center;padding:10px 8px 10px 16px;border-bottom:1px solid var(--line);min-height:56px}
.srow:last-child{border-bottom:none}
.srow .sm1{flex:1;min-width:0}
.srow .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .d{font-size:12px;color:var(--muted)}
.srow .btn-sm{margin-right:8px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.sw{position:relative;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw span{display:block;width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw input:checked+span{box-shadow:0 0 0 2px var(--ink)}
.sw input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px}
/* SC-01 ログイン */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;gap:10px}
.login .app-title{font-size:28px;font-weight:700;margin-top:8px}
.login p{color:var(--muted);font-size:14px}
.gbtn{display:flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-radius:24px;background:var(--surface);border:1px solid var(--line);font-weight:700;margin-top:16px}
.errbox{display:flex;gap:8px;text-align:left;background:var(--expired-soft);color:var(--expired);border-radius:10px;padding:10px 12px;font-size:13px;max-width:320px;margin-top:8px}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>

<script>
// ===== デモ用の基準日 =====
const TODAY = '2026-09-27';
const NEAR_DAYS = 30, LOW_SERVINGS = 3;

// ===== 初期データ（01_requirements 5.1）＋デモ用サンプル値 =====

const lots = [

  {id:'l2',brand:'b2',init:50,rem:27,bb:null,buy:'2026-06-02'},

  {id:'l5',brand:'b5',init:80,rem:49,bb:'2026-10-20',buy:'2026-03-15'},

  {id:'l9',brand:'b9',init:50,rem:12,bb:'2026-09-15',buy:'2025-12-01'},
  {id:'l10',brand:'b10',init:10,rem:8,bb:'2027-04-30',buy:'2026-08-30'},
  {id:'l11',brand:'b11',init:8,rem:3,bb:'2026-11-30',buy:'2026-06-10'},
  {id:'l12',brand:'b12',init:5,rem:2,bb:null,buy:'2026-07-22'},
  {id:'l13',brand:'b13',init:5,rem:1,bb:'2027-01-31',buy:'2026-05-05'},
  {id:'l14',brand:'b14',init:3,rem:1,bb:'2026-08-31',buy:'2026-01-20'},
  {id:'l15',brand:'b15',init:50,rem:0,bb:'2026-12-31',buy:'2026-03-01',depleted:true},
].map(l=>({depleted:false,...l}));

// 履歴（デモ用に生成）
const histories = [];
function addDays(d,n){const t=new Date(d+'T00:00:00');t.setDate(t.getDate()+n);return iso(t)}
function iso(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
lots.forEach(l=>{
  const b=brandOf(l.brand);
  histories.push({lot:l.id,brand:l.brand,date:l.buy,who:'あなた',reason:'IN',delta:l.init,after:l.init});
  let q=l.init, day=3, n=0;
  const step=b.serving*2;
  while(q-step>=l.rem && n<3){q=r1(q-step);histories.push({lot:l.id,brand:l.brand,date:addDays(l.buy,day),who:n%2?'家族':'あなた',reason:'CONSUME',delta:-step,servings:2,after:q});day+=9;n++}
  if(q!==l.rem){const d=r1(l.rem-q);histories.push({lot:l.id,brand:l.brand,date:addDays(l.buy,day),who:'あなた',reason:l.depleted?'DEPLETE':'ADJUST',delta:d,after:l.rem})}
});

// ===== ユーティリティ =====
function r1(v){return Math.round(v*10)/10}
function brandOf(id){return brands.find(b=>b.id===id)}
function genreOf(id){return genres.find(g=>g.id===id)}
function fmtQty(v,form){return form==='BAG'?`${v}個`:`${Number.isInteger(v)?v:v.toFixed(1)}g`}
function fmtDate(d){return d?d.replaceAll('-','/'):'—'}
function daysUntil(d){return Math.round((new Date(d+'T00:00:00')-new Date(TODAY+'T00:00:00'))/864e5)}
function activeLots(bid){return lots.filter(l=>l.brand===bid&&!l.depleted)}
function sortFefo(ls){return [...ls].sort((a,b)=>{
  if(a.bb!==b.bb){if(!a.bb)return 1;if(!b.bb)return -1;return a.bb<b.bb?-1:1}
  return a.buy<b.buy?-1:a.buy>b.buy?1:0})}
function servingsOf(qty,serving){return Math.floor(Math.round(qty*10)/Math.round(serving*10))}
function totalRem(bid){return r1(activeLots(bid).reduce((s,l)=>s+l.rem,0))}
function lotAlerts(l,b){const a=[];if(l.bb){const d=daysUntil(l.bb);if(d<0)a.push('expired');else if(d<=NEAR_DAYS)a.push('near')}return a}
function brandAlerts(b){
  const ls=activeLots(b.id); if(!ls.length)return [];
  const s=new Set(); ls.forEach(l=>lotAlerts(l,b).forEach(x=>s.add(x)));
  if(servingsOf(totalRem(b.id),b.serving)<=LOW_SERVINGS)s.add('low');
  return ['expired','near','low'].filter(x=>s.has(x));
}
const ALERT_LABEL={expired:'期限切れ',near:'期限間近',low:'残りわずか'};
function badgeHtml(a){return a.map(x=>`<span class="badge ${x}">${ALERT_LABEL[x]}</span>`).join('')}
function nearestBb(bid){const d=activeLots(bid).map(l=>l.bb).filter(Boolean).sort();return d[0]||null}
function fillPct(bid){const ls=activeLots(bid);const i=ls.reduce((s,l)=>s+l.init,0);return i?Math.round(ls.reduce((s,l)=>s+l.rem,0)/i*100):0}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function expText(bb){if(!bb)return '期限未入力';const d=daysUntil(bb);
  return d<0?`期限 ${fmtDate(bb)}（${-d}日超過）`:`期限 ${fmtDate(bb)}（あと${d}日）`}

// ===== 操作 =====
function nowDate(){return TODAY}
function consume(b,lot,amount,servings){
  lot.rem=r1(lot.rem-amount);
  histories.push({lot:lot.id,brand:b.id,date:nowDate(),who:'あなた',reason:'CONSUME',delta:-amount,servings:servings||null,after:lot.rem});
  st.servings=1; render();
  if(lot.rem<=0){
    dialog({title:'使い切りにしますか？',body:`<p>このロットの残量が0になりました。使い切りにすると一覧から外れます。</p>`,
      actions:[{label:'あとで',kind:'text'},{label:'使い切りにする',kind:'primary',fn:()=>deplete(b,lot)}]});
  }else snack(servings?`${servings}杯飲みました（${fmtQty(amount,b.form)}）`:`${fmtQty(amount,b.form)}飲みました`);
}
function deplete(b,lot){
  const prev=lot.rem; lot.rem=0; lot.depleted=true; if(st.pinLot===lot.id)st.pinLot=null;
  histories.push({lot:lot.id,brand:b.id,date:nowDate(),who:'あなた',reason:'DEPLETE',delta:-prev,after:0});
  render(); snack('使い切りにしました',{label:'元に戻す',fn:()=>restore(b,lot,prev)});
}
function restore(b,lot,prev){
  if(prev===undefined){const h=histories.filter(x=>x.lot===lot.id&&x.reason==='DEPLETE').pop();prev=h?-h.delta:0}
  lot.rem=prev; lot.depleted=false;
  histories.push({lot:lot.id,brand:b.id,date:nowDate(),who:'あなた',reason:'RESTORE',delta:prev,after:prev});
  render(); snack('使い切りを取り消しました');
}
function adjust(b,lot,v){
  const d=r1(v-lot.rem); if(d===0)return;
  lot.rem=v; histories.push({lot:lot.id,brand:b.id,date:nowDate(),who:'あなた',reason:'ADJUST',delta:d,after:v});
  render(); snack('残量を修正しました');
}
function validQty(v,b,{allowZero=false,max=Infinity}={}){
  if(v===''||isNaN(v))return '数値を入力してください';
  const n=Number(v);
  if(b.form==='BAG'&&!Number.isInteger(n))return '個数は整数で入力してください';
  if(b.form==='LEAF'&&!/^\d+(\.\d)?$/.test(String(v).trim()))return '小数第1位まで入力できます';
  if(n<0||(!allowZero&&n===0))return allowZero?'0以上で入力してください':'0より大きい値を入力してください';
  if(n>max)return `残量（${fmtQty(max,b.form)}）を超えています`;
  return null;
}
function qtyDialog({title,desc,label,init,b,max,allowZero,okLabel,fn}){
  dialog({title,body:`${desc?`<p>${desc}</p>`:''}<label class="field"><span class="flabel">${label}（${b.form==='BAG'?'個':'g'}）</span>
    <input id="qtyIn" type="number" inputmode="decimal" step="${b.form==='BAG'?1:0.1}" value="${init??''}"><div class="err" id="qtyErr"></div></label>`,
    actions:[{label:'キャンセル',kind:'text'},{label:okLabel,kind:'primary',keep:true,fn:()=>{
      const v=document.getElementById('qtyIn').value;const e=validQty(v,b,{allowZero,max});
      if(e){document.getElementById('qtyErr').textContent=e;return false}closeOverlay();fn(r1(Number(v)))}}]});
  setTimeout(()=>document.getElementById('qtyIn')?.focus(),50);
}

document.addEventListener('input',e=>{
  if(e.target.dataset.draft&&draft){draft[e.target.dataset.draft]=e.target.value;if(e.target.dataset.draft==='name'){const h=document.getElementById('dupHint');if(h)h.textContent=dupMsg()}return}
  if(e.target.dataset.pdraft&&pdraft){pdraft[e.target.dataset.pdraft]=e.target.value;if(e.target.dataset.pdraft==='qty'){const h=document.getElementById('pHelp');if(h)h.textContent=purchaseHelp()}if(e.target.dataset.pdraft==='bb')render();return}
  if(e.target.id==='q'){st.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos)}
});
document.addEventListener('change',e=>{if(e.target.id==='sort'){st.sort=e.target.value;render()}});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const a=el.dataset.act, v=el.dataset.v; const r=route(); const b=r.page==='detail'?brandOf(r.id):null;
  switch(a){
    case 'alert': st.alert=st.alert===v?null:v; render(); break;
    case 'genre': st.genre=v; render(); break;
    case 'form': st.form=v; render(); break;
    case 'clear': Object.assign(st,{q:'',genre:'all',form:'all',alert:null}); render(); break;
    case 'todo': snack(`「${v}」は未作成です`); break;
    case 'newBrand': openNew(); break;
    case 'genreJump': Object.assign(st,{genre:v,alert:null,q:'',form:'all'}); tab('list'); break;
    case 'addGenre': genreDialog(null); break;
    case 'genreMenu': genreMenu(genres.find(g=>g.id===v)); break;
    case 'restoreBrand': {const x=brandOf(v); x.deleted=false; render(); snack(`「${x.name}」を復元しました`); break}
    case 'restoreLotS': {const l=lots.find(x=>x.id===v); restore(brandOf(l.brand),l); break}
    case 'logout': dialog({title:'ログアウトしますか？',body:'<p>次に開いたときは、もう一度ログインが必要です。</p>',
      actions:[{label:'キャンセル',kind:'text'},{label:'ログアウト',kind:'primary',fn:()=>{st.loginError=false;tab('login')}}]}); break;
    case 'login': st.loginError=false; tab('list'); snack('ログインしました'); break;
    case 'loginErr': st.loginError=true; render(); break;
    case 'editBrand': openEdit(brandOf(v)); break;
    case 'purchase': openPurchase(v); break;
    case 'pickGenre': draft.genre=v; draft.errors.genre=''; render(); break;
    case 'pickForm': draft.form=v; if(v==='LEAF'&&!draft.serving)draft.serving='3'; render(); break;
    case 'addFlv': addFlavor(draft.flv); break;
    case 'addFlvV': addFlavor(v); break;
    case 'rmFlv': draft.flavors=draft.flavors.filter(f=>f!==v); render(); break;
    case 'saveBrand': saveBrand(); break;
    case 'clearBb': pdraft.bb=''; render(); break;
    case 'savePurchase': savePurchase(); break;
    case 'back': if(nav.length>1){nav.pop();render()} break;
    case 'go': go({page:'detail',id:v}); break;
    case 'tab': tab(v); break;
    case 'inc': st.servings++; render(); break;
    case 'dec': st.servings--; render(); break;
    case 'unpin': st.pinLot=null; st.servings=1; render(); break;
    case 'toggleDep': st.showDepleted=!st.showDepleted; render(); break;
    case 'drink': {const t=targetLot(b); consume(b,t.lot,r1(b.serving*st.servings),st.servings); break}
    case 'depleteTarget': {const t=targetLot(b); deplete(b,t.lot); break}
    case 'amount': {const t=targetLot(b); qtyDialog({title:'量を指定して飲んだ',desc:'ブレンドなどで1杯分と違う量を使ったときに使います。',
      label:'使った量',b,max:t.lot.rem,okLabel:'飲んだ',fn:v=>consume(b,t.lot,v,null)}); break}
    case 'restore': {const l=lots.find(x=>x.id===v); restore(b,l); break}
    case 'lotMenu': {const l=lots.find(x=>x.id===v); const isT=targetLot(b)?.lot.id===l.id;
      sheet(`ロット（${fmtQty(l.rem,b.form)}／${l.bb?'期限 '+fmtDate(l.bb):'期限未入力'}）`,[
        {icon:'local_cafe',label:'このロットから飲む',disabled:isT&&st.pinLot===l.id,fn:()=>{st.pinLot=l.id;st.servings=1;render();window.scrollTo({top:0,behavior:'smooth'})}},
        {icon:'tune',label:'残量を修正',fn:()=>qtyDialog({title:'残量を修正',desc:'計量した実際の残量を入力します。',label:'残量',init:l.rem,b,allowZero:true,okLabel:'保存',fn:x=>adjust(b,l,x)})},
        {icon:'event',label:'賞味期限・購入日を修正',fn:()=>dialog({title:'賞味期限・購入日を修正',body:`<label class="field"><span class="flabel">賞味期限</span><input id="eBb" type="date" value="${l.bb||''}"></label>
          <p class="help" style="margin:4px 0 0">空欄にすると「期限未入力」になります</p>
          <label class="field"><span class="flabel">購入日</span><input id="eBuy" type="date" value="${l.buy}" max="${TODAY}"><div class="err" id="eErr"></div></label>`,
          actions:[{label:'キャンセル',kind:'text'},{label:'保存',kind:'primary',keep:true,fn:()=>{const bb=document.getElementById('eBb').value,buy=document.getElementById('eBuy').value;
            const er=!buy?'購入日を入力してください':buy>TODAY?'今日より後の日付は入力できません':'';if(er){document.getElementById('eErr').textContent=er;return}
            closeOverlay();l.bb=bb||null;l.buy=buy;render();snack('保存しました')}}]})},
        {icon:'done_all',label:'使い切りにする',danger:true,fn:()=>dialog({title:'使い切りにしますか？',body:`<p>残り${fmtQty(l.rem,b.form)}を使い切りとして記録します。</p>`,
          actions:[{label:'キャンセル',kind:'text'},{label:'使い切りにする',kind:'primary',fn:()=>deplete(b,l)}]})},
      ]); break}
    case 'brandMenu': {const has=activeLots(b.id).length>0;
      sheet(b.name,[
        {icon:'edit',label:'銘柄を編集',fn:()=>openEdit(b)},
        {icon:'delete',label:'銘柄を削除',danger:true,disabled:has,why:has?'在庫が残っているため削除できません':'',fn:()=>dialog({title:'銘柄を削除しますか？',body:`<p>「${esc(b.name)}」を一覧から外します。設定の「削除した銘柄」から復元できます。</p>`,
          actions:[{label:'キャンセル',kind:'text'},{label:'削除する',kind:'danger',fn:()=>{b.deleted=true;b.deletedAt=TODAY;nav.pop();render();
            snack('銘柄を削除しました',{label:'元に戻す',fn:()=>{b.deleted=false;render();snack('復元しました')}})}}]})},
      ]); break}
  }
});



// ===== SC-06 集計 =====
function liveBrands(){return brands.filter(b=>!b.deleted)}
function renderSummary(){
  const inStock=liveBrands().filter(b=>activeLots(b.id).length);
  const sumBy=(bs,form)=>r1(bs.filter(b=>b.form===form).reduce((t,b)=>t+totalRem(b.id),0));
  const rows=genres.map(g=>{const bs=inStock.filter(b=>b.genre===g.id);return{g,n:bs.length,leaf:sumBy(bs,'LEAF'),bag:sumBy(bs,'BAG')}});
  const maxLeaf=Math.max(1,...rows.map(r=>r.leaf));
  const fmtG=v=>Number.isInteger(v)?v:v.toFixed(1);
  return `
  <header class="appbar"><h1>集計</h1></header>
  <div class="stats">
    <div class="stat"><div class="n">${inStock.length}</div><div class="l">在庫のある銘柄</div></div>
    <div class="stat"><div class="n">${fmtG(sumBy(inStock,'LEAF'))}<small>g</small></div><div class="l">茶葉の合計</div></div>
    <div class="stat"><div class="n">${sumBy(inStock,'BAG')}<small>個</small></div><div class="l">ティーバッグの合計</div></div>
  </div>
  <div class="section-title">ジャンル別</div>
  <div class="list">
    ${rows.map(r=>`<button class="grow ${r.n?'':'zero'}" style="--liq:${r.g.color}" data-act="genreJump" data-v="${r.g.id}" ${r.n?'':'disabled'}>
      <span class="dotlg" aria-hidden="true"></span>
      <div class="gm"><div class="gname">${r.g.name}</div>
        <div class="gsub">${r.n?`${r.n}銘柄`:'在庫なし'}</div>
        ${r.leaf?`<div class="gbar"><i style="width:${Math.round(r.leaf/maxLeaf*100)}%"></i></div>`:''}</div>
      <div class="gv">${r.leaf?`<div>茶葉 <b>${fmtG(r.leaf)}</b>g</div>`:''}${r.bag?`<div>ティーバッグ <b>${r.bag}</b>個</div>`:''}</div>
    </button>`).join('')}
  </div>
  <p class="note">ジャンルをタップすると、在庫一覧をそのジャンルで絞り込んで表示します。バーは茶葉の残量（g）の比較です。</p>
  ${bnav('summary')}`;
}

// ===== SC-07 設定 =====
// 色マスタ（colors シート）の初期値
const COLORS=[['#9a3f1c','紅茶色'],['#7a9a3a','煎茶色'],['#b27a2e','烏龍色'],['#cdb97e','白茶色'],['#a3b457','若草色'],['#b8432b','赤茶色'],['#c04a78','果実色'],['#4f7f9a','藍色'],['#6d5a8c','藤色'],['#3f7a63','深緑色'],['#8a7a6a','灰茶色']];
const PALETTE=COLORS.map(c=>c[0]);
function renderSettings(){
  const del=brands.filter(b=>b.deleted);
  const dep=lots.filter(l=>l.depleted&&!brandOf(l.brand).deleted)
    .map(l=>({l,h:histories.filter(h=>h.lot===l.id&&h.reason==='DEPLETE').pop()}))
    .sort((a,b)=>((b.h?.date||'')>(a.h?.date||'')?1:-1)).slice(0,10);
  const cntG=gid=>liveBrands().filter(b=>b.genre===gid).length;
  return `
  <header class="appbar"><h1>設定</h1></header>
  <div class="section-title">ジャンル<button class="btn text btn-sm" data-act="addGenre"><span class="material-icons sm" aria-hidden="true">add</span>追加</button></div>
  <div class="list">${genres.map(g=>`<div class="srow" style="--liq:${g.color}">
      <span class="dotlg" aria-hidden="true"></span>
      <div class="sm1"><div class="t">${esc(g.name)}</div><div class="d">${cntG(g.id)}銘柄</div></div>
      <button class="icon-btn" data-act="genreMenu" data-v="${g.id}" aria-label="${esc(g.name)}の操作"><span class="material-icons" aria-hidden="true">more_vert</span></button></div>`).join('')}</div>

  <div class="section-title">削除した銘柄（${del.length}）</div>
  <div class="list">${del.length?del.map(b=>{const g=genreOf(b.genre);return `<div class="srow" style="--liq:${g.color}">
      <span class="dotlg" aria-hidden="true"></span>
      <div class="sm1"><div class="t">${esc(b.name)}</div><div class="d">${g.name}／削除 ${fmtDate(b.deletedAt)}</div></div>
      <button class="btn outline btn-sm" data-act="restoreBrand" data-v="${b.id}"><span class="material-icons sm" aria-hidden="true">restore</span>復元</button></div>`}).join('')
    :'<div class="empty">削除した銘柄はありません</div>'}</div>

  <div class="section-title">使い切ったロット（最近10件）</div>
  <div class="list">${dep.length?dep.map(({l,h})=>{const b=brandOf(l.brand),g=genreOf(b.genre);return `<div class="srow" style="--liq:${g.color}">
      <span class="dotlg" aria-hidden="true"></span>
      <div class="sm1"><div class="t">${esc(b.name)}</div><div class="d">購入 ${fmtQty(l.init,b.form)}／使い切り ${fmtDate(h?.date)}</div></div>
      <button class="btn outline btn-sm" data-act="restoreLotS" data-v="${l.id}"><span class="material-icons sm" aria-hidden="true">undo</span>元に戻す</button></div>`}).join('')
    :'<div class="empty">使い切ったロットはありません</div>'}</div>

  <div class="section-title">アカウント</div>
  <div class="list">
    <div class="srow"><span class="material-icons" aria-hidden="true" style="color:var(--muted)">account_circle</span>
      <div class="sm1"><div class="t">you@example.com</div><div class="d">ログイン中</div></div>
      <button class="btn text btn-sm" data-act="logout"><span class="material-icons sm" aria-hidden="true">logout</span>ログアウト</button></div>
  </div>
  <p class="note">Chaicoss バージョン 0.1.0（ワイヤーフレーム）</p>
  ${bnav('settings')}`;
}
function genreDialog(g){
  const cur=g?g.color:PALETTE.find(c=>!genres.some(x=>x.color===c))||PALETTE[0];
  dialog({title:g?'ジャンルを編集':'ジャンルを追加',body:`
    <label class="field"><span class="flabel">ジャンル名</span><input id="gName" maxlength="20" value="${g?esc(g.name):''}" autocomplete="off"><div class="err" id="gErr"></div></label>
    <div class="field"><span class="flabel">色（お茶の水色）</span><div class="swatches">
      ${COLORS.map(([c,n])=>`<label class="sw" title="${n}"><input type="radio" name="gColor" value="${c}" aria-label="${n}" ${c===cur?'checked':''}><span style="background:${c}"></span></label>`).join('')}</div></div>`,
    actions:[{label:'キャンセル',kind:'text'},{label:g?'保存':'追加',kind:'primary',keep:true,fn:()=>{
      const name=document.getElementById('gName').value.trim(), color=document.querySelector('input[name=gColor]:checked').value;
      const err=!name?'ジャンル名を入力してください':genres.some(x=>x.name===name&&x!==g)?'同じ名前のジャンルがあります':'';
      if(err){document.getElementById('gErr').textContent=err;return}
      closeOverlay();
      if(g){g.name=name;g.color=color;snack('保存しました')}else{genres.push({id:'g'+Date.now(),name,color});snack('ジャンルを追加しました')}
      render();}}]});
  setTimeout(()=>document.getElementById('gName')?.focus(),50);
}
function genreMenu(g){
  const i=genres.indexOf(g), used=brands.some(b=>b.genre===g.id);
  sheet(g.name,[
    {icon:'edit',label:'名前・色を変更',fn:()=>genreDialog(g)},
    {icon:'arrow_upward',label:'上へ移動',disabled:i===0,fn:()=>{genres.splice(i,1);genres.splice(i-1,0,g);render()}},
    {icon:'arrow_downward',label:'下へ移動',disabled:i===genres.length-1,fn:()=>{genres.splice(i,1);genres.splice(i+1,0,g);render()}},
    {icon:'delete',label:'削除',danger:true,disabled:used,why:used?'このジャンルの銘柄があるため削除できません（削除した銘柄を含む）':'',
      fn:()=>dialog({title:'ジャンルを削除しますか？',body:`<p>「${esc(g.name)}」を削除します。</p>`,
        actions:[{label:'キャンセル',kind:'text'},{label:'削除する',kind:'danger',fn:()=>{genres.splice(genres.indexOf(g),1);render();snack('ジャンルを削除しました')}}]})},
  ]);
}

// ===== SC-04 銘柄登録・編集 / SC-05 購入登録 =====
let draft=null, pdraft=null, focusFlv=false;
function allFlavors(){return [...new Set(brands.flatMap(b=>b.flavors))].sort((a,b)=>a.localeCompare(b,'ja'))}
function openNew(){draft={mode:'new',name:'',genre:null,flavors:[],form:'LEAF',serving:'3',shop:'',memo:'',flv:'',errors:{}};go({page:'brandForm'})}
function openEdit(b){draft={mode:'edit',id:b.id,name:b.name,genre:b.genre,flavors:[...b.flavors],form:b.form,serving:String(b.serving),
  shop:b.shop||'',memo:b.memo||'',flv:'',errors:{}};go({page:'brandForm'})}
function openPurchase(bid){
  const last=lots.filter(l=>l.brand===bid).sort((a,b)=>a.buy<b.buy?1:-1)[0];
  pdraft={brand:bid,qty:last?String(last.init):'',bb:'',buy:TODAY,errors:{},fromLast:!!last};go({page:'purchase',id:bid})}
function dupMsg(){if(!draft)return '';const n=draft.name.trim();const m=n&&brands.find(b=>b.name===n&&b.id!==draft.id);
  return !m?'':m.deleted?'削除した銘柄に同じ名前があります（設定から復元できます）':'同じ名前の銘柄がすでにあります'}
function errHtml(k,o){return `<div class="err">${(o.errors[k])||''}</div>`}

  const isNew=d.mode==='new'; const lockForm=!isNew&&activeLots(d.id).length>0;
  const sugg=allFlavors().filter(f=>!d.flavors.includes(f)).slice(0,14);

  <header class="appbar detail">
    <button class="icon-btn" data-act="back" aria-label="閉じる"><span class="material-icons" aria-hidden="true">close</span></button>
    <h1>${isNew?'銘柄を登録':'銘柄を編集'}</h1>
  </header>
  <div class="form">
    <label class="field"><span class="flabel">銘柄名<span class="req">*</span></span>
      <input data-draft="name" maxlength="50" value="${esc(d.name)}" placeholder="例：白牡丹" autocomplete="off">
      ${errHtml('name',d)}<div class="dup" id="dupHint">${dupMsg()}</div></label>

    <div class="field"><span class="flabel">ジャンル<span class="req">*</span></span>
      <div class="choice" role="radiogroup" aria-label="ジャンル">

      </div>${errHtml('genre',d)}</div>

    <div class="field"><span class="flabel">フレーバー</span>
      <div class="tags">${d.flavors.map(f=>`<span class="tagx">${esc(f)}<button data-act="rmFlv" data-v="${esc(f)}" aria-label="${esc(f)}を外す"><span class="material-icons sm" aria-hidden="true">close</span></button></span>`).join('')}</div>
      <div class="addrow"><input id="flvIn" data-draft="flv" maxlength="20" value="${esc(d.flv)}" placeholder="例：桜" enterkeyhint="done" autocomplete="off">
        <button class="btn outline btn-sm" data-act="addFlv"><span class="material-icons sm" aria-hidden="true">add</span>追加</button></div>
      ${errHtml('flv',d)}
      ${sugg.length?`<div class="sugg"><span class="hint">候補</span>${sugg.map(f=>`<button class="chip" data-act="addFlvV" data-v="${esc(f)}">${esc(f)}</button>`).join('')}</div>`:''}
    </div>

    <div class="field"><span class="flabel">形態<span class="req">*</span></span>
      <div class="seg big" role="group" aria-label="形態">
        ${[['LEAF','茶葉'],['BAG','ティーバッグ']].map(([v,l])=>`<button data-act="pickForm" data-v="${v}" aria-pressed="${d.form===v}" ${lockForm?'disabled':''}>${l}</button>`).join('')}
      </div>${lockForm?'<div class="help">在庫が残っているため変更できません</div>':''}</div>

    <div class="field"><span class="flabel">1杯の量<span class="req">*</span></span>
      ${d.form==='LEAF'
        ?`<div class="unit"><input type="number" inputmode="decimal" step="0.1" data-draft="serving" value="${esc(d.serving)}" aria-label="1杯の量（g）"><span class="u">g</span></div>
          <div class="help">パッケージに記載がなければ3gのままで大丈夫です</div>${errHtml('serving',d)}`
        :`<div class="fixed">1個（ティーバッグは1杯＝1個）</div>`}
    </div>

    <label class="field"><span class="flabel">購入店</span>
      <input data-draft="shop" maxlength="50" value="${esc(d.shop)}" autocomplete="off"></label>
    <label class="field"><span class="flabel">メモ</span>
      <textarea data-draft="memo" maxlength="200" rows="3">${esc(d.memo)}</textarea></label>
  </div>
  <div class="footer"><button class="btn primary block main" data-act="saveBrand">${isNew?'次へ：購入を登録':'保存'}</button></div>`;
}

function purchaseHelp(){const p=pdraft,b=brandOf(p.brand);
  if(validQty(p.qty,b))return '';return `＝ ${servingsOf(Number(p.qty),b.serving)}杯分`}
function renderPurchase(){
  const p=pdraft; if(!p)return renderPlaceholder('list');
  const b=brandOf(p.brand), g=genreOf(b.genre), n=activeLots(b.id).length;
  const unit=b.form==='BAG'?'個':'g';
  return `
  <header class="appbar detail">
    <button class="icon-btn" data-act="back" aria-label="戻る"><span class="material-icons" aria-hidden="true">arrow_back</span></button>
    <h1>購入を登録</h1>
  </header>
  <div class="hero">
    <span class="cup" style="--liq:${g.color};--fill:${fillPct(b.id)}%" aria-hidden="true"></span>
    <div style="min-width:0"><div class="name" style="font-weight:700">${esc(b.name)}</div>
      <div class="genre">${g.name}／${b.form==='LEAF'?'茶葉':'ティーバッグ'}／1杯 ${fmtQty(b.serving,b.form)}</div></div>
  </div>
  <div class="form">
    ${n?`<div class="infobox"><span class="material-icons sm" aria-hidden="true">info</span><span>在庫が${n}ロットあります。今回の購入は別のロットとして登録します。</span></div>`:''}
    <label class="field"><span class="flabel">購入量<span class="req">*</span></span>
      <div class="unit"><input type="number" inputmode="${b.form==='BAG'?'numeric':'decimal'}" step="${b.form==='BAG'?1:0.1}" data-pdraft="qty" value="${esc(p.qty)}" aria-label="購入量（${unit}）"><span class="u">${unit}</span></div>
      <div class="help"><span id="pHelp">${purchaseHelp()}</span>${p.fromLast?'<span>（前回の購入量を入れています）</span>':''}</div>
      ${errHtml('qty',p)}</label>
    <div class="field"><label for="bbIn" class="flabel">賞味期限</label>
      <div class="date-row"><input id="bbIn" type="date" data-pdraft="bb" value="${p.bb}">
        ${p.bb?'<button class="btn text btn-sm" data-act="clearBb">クリア</button>':''}</div>
      <div class="help">わからない場合は空欄のまま登録できます</div></div>
    <div class="field"><label for="buyIn" class="flabel">購入日<span class="req">*</span></label>
      <input id="buyIn" type="date" data-pdraft="buy" value="${p.buy}" max="${TODAY}">
      ${errHtml('buy',p)}</div>
  </div>
  <div class="footer"><button class="btn primary block main" data-act="savePurchase">購入を登録</button></div>`;
}

function addFlavor(raw){
  const d=draft; const v=(raw||'').trim(); d.errors.flv='';
  if(!v)return;
  if(v.length>20)d.errors.flv='20文字以内で入力してください';
  else if(d.flavors.includes(v))d.errors.flv='すでに追加されています';
  else if(d.flavors.length>=10)d.errors.flv='フレーバーは10個まで登録できます';
  else{d.flavors.push(v);if(raw===d.flv)d.flv=''}
  focusFlv=true; render();
}
function saveBrand(){
  const d=draft,e={}; const name=d.name.trim();
  if(!name)e.name='銘柄名を入力してください';
  if(!d.genre)e.genre='ジャンルを選んでください';
  let serving=1;
  if(d.form==='LEAF'){
    const t=String(d.serving).trim(), n=Number(t);
    if(t===''||isNaN(n))e.serving='数値を入力してください';
    else if(!/^\d+(\.\d)?$/.test(t))e.serving='小数第1位まで入力できます';
    else if(n<0.1||n>100)e.serving='0.1〜100の範囲で入力してください';
    else serving=n;
  }
  d.errors=e;
  if(Object.keys(e).length){render();const el=document.querySelector('.err:not(:empty)');el&&el.scrollIntoView({block:'center',behavior:'smooth'});return}
  const vals={name,genre:d.genre,flavors:[...d.flavors],form:d.form,serving,shop:d.shop.trim()||null,memo:d.memo.trim()||null};
  if(d.mode==='new'){
    const id='b'+Date.now(); brands.push({id,...vals}); draft=null; nav.pop();
    snack('銘柄を登録しました'); openPurchase(id);
  }else{
    Object.assign(brandOf(d.id),vals); draft=null; nav.pop(); render(); snack('保存しました');
  }
}
function savePurchase(){
  const p=pdraft,b=brandOf(p.brand),e={};
  const qe=validQty(p.qty,b); if(qe)e.qty=qe;
  if(!p.buy)e.buy='購入日を入力してください'; else if(p.buy>TODAY)e.buy='今日より後の日付は入力できません';
  p.errors=e; if(Object.keys(e).length){render();return}
  const q=r1(Number(p.qty));
  const l={id:'l'+Date.now(),brand:b.id,init:q,rem:q,bb:p.bb||null,buy:p.buy,depleted:false};
  lots.push(l); histories.push({lot:l.id,brand:b.id,date:TODAY,who:'あなた',reason:'IN',delta:q,after:q});
  pdraft=null; nav.pop(); const top=route();
  if(!(top.page==='detail'&&top.id===b.id))nav.push({page:'detail',id:b.id});
  render(); window.scrollTo(0,0); snack('購入を登録しました');
}
document.addEventListener('keydown',e=>{if(e.target.id==='flvIn'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();addFlavor(draft.flv)}});

// ===== オーバーレイ部品 =====
function closeOverlay(){document.getElementById('overlay').innerHTML=''}
function sheet(title,items){
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="grab"></div><h3>${esc(title)}</h3>
    ${items.map((it,i)=>`<button data-i="${i}" class="${it.danger?'danger':''}" ${it.disabled?'disabled':''}>${it.icon?`<span class="material-icons" aria-hidden="true">${it.icon}</span>`:''}<span>${it.label}${it.why?`<span class="why">${it.why}</span>`:''}</span></button>`).join('')}</div></div>`;
  ov.onclick=e=>{if(e.target.dataset.scrim!==undefined){closeOverlay();return}
    const btn=e.target.closest('button[data-i]');if(!btn)return;closeOverlay();items[btn.dataset.i].fn()};
}
function dialog({title,body,actions}){
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<div class="scrim center" data-scrim><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${body}
    <div class="actions">${actions.map((x,i)=>`<button class="btn ${x.kind==='primary'?'primary':x.kind==='danger'?'danger':'text'}" data-i="${i}">${x.label}</button>`).join('')}</div></div></div>`;
  ov.onclick=e=>{if(e.target.dataset.scrim!==undefined){closeOverlay();return}
    const btn=e.target.closest('button[data-i]');if(!btn)return;const x=actions[btn.dataset.i];
    if(x.keep){x.fn();return}closeOverlay();x.fn&&x.fn()};
}
let snackTimer;
function snack(msg,action){
  document.querySelector('.snack')?.remove(); clearTimeout(snackTimer);
  const s=document.createElement('div'); s.className='snack'+(['list','summary','settings'].includes(route().page)?'':' detail'); s.setAttribute('role','status');
  s.innerHTML=`<span>${esc(msg)}</span>${action?`<button>${action.label}</button>`:''}`;
  if(action)s.querySelector('button').onclick=()=>{s.remove();action.fn()};
  document.body.appendChild(s); snackTimer=setTimeout(()=>s.remove(),action?6000:3000);
}

render();
</script>
